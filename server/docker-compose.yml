services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_PREFIX: meter
      DB_PATH: /data/meter.db
      TZ: Asia/Manila
    volumes:
      - app-data:/data
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto-data:
  app-data:
