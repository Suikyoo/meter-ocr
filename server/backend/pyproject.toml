[project]
name = "meter-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "paho-mqtt>=2.1",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
